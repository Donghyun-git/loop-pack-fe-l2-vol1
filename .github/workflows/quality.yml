name: Quality

'on':
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # 스모크 실행의 cold 소요에 여유를 더해 정한다. 지금 값은 잠정치이고,
    # 첫 pull_request 실행을 본 뒤 좁힌다. 타임아웃으로 끊긴 실행은
    # 측정 표본에서 제외하고 재실행한다.
    timeout-minutes: 20
    # 아래 5개 검증 스텝이 모두 읽을 수 있게 job 레벨에 둔다.
    # 분리 전에는 `pnpm check` 한 스텝이 이 값을 갖고 5개 명령을 모두 실행했으므로,
    # job 레벨 선언은 분리 전과 동일한 가시성을 그대로 재현한다.
    env:
      # APP_ORIGIN 은 기본값이 없어 없으면 build 가 실패한다.
      # 배포 환경과 마찬가지로 CI 도 값을 명시적으로 주입한다.
      APP_ORIGIN: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.15.1
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 1단계 최적화: 지목한 병목 하나에만 대응한다.
      #
      # Before 측정에서 이 스텝이 단일 최장 구간이었다(중앙값 23s, job 창의 약 25%).
      # cold 23s / warm 26s 로 조건과 무관하게 같은 값이 나오는데, ~/.cache/ms-playwright
      # 가 캐시되지 않아 매 실행이 브라우저를 새로 받기 때문이다.
      #
      # --only-shell 은 풀 Chrome for Testing 바이너리를 받지 않고 headless shell 만 받는다.
      # dry-run 대조 결과 받는 항목이 넷에서 셋으로 줄고, 빠지는 것이 정확히 풀 브라우저다.
      # playwright.config.ts 의 devices['Desktop Chrome'] 는 channel 을 지정하지 않으므로
      # (1.62.1 에서 확인) headless 실행은 headless shell 로 뜬다.
      #
      # 브라우저 바이너리를 캐시하지 않는다. Playwright 공식 문서가 권장하지 않고
      # (복원 비용이 다운로드 비용과 비슷하고 OS 의존성은 캐시 대상이 아니다),
      # 이 레포의 Before 측정에서도 pnpm 캐시가 아낀 시간이 3초로 지터에 묻혔다.
      #
      # --with-deps 는 유지한다. 이번 커밋은 전략 하나만 적용해 인과를 분명히 둔다.
      - name: Install Playwright Chromium when used
        run: |
          if pnpm exec playwright --version >/dev/null 2>&1; then
            pnpm exec playwright install --with-deps --only-shell chromium
          fi
      # --- 계측을 위한 분리: `pnpm check` 의 5개 명령을 스텝으로 편다 ---
      #
      # 이것은 최적화가 아니라 계측이다. 분리 전 `pnpm check` 는
      #   pnpm test && pnpm lint && pnpm typecheck && pnpm build && pnpm test:e2e
      # 였고, 아래 5개 스텝은 같은 명령을 같은 순서로 실행한다.
      # GitHub 은 각 스텝에 `if: success()` 를 암묵 적용하므로 `&&` 의 단축 평가도
      # 그대로 재현된다. 즉 실행되는 검증 셋·순서·중단 의미가 모두 동일하다.
      #
      # 분리하는 이유는 하나다. 합쳐 두면 Actions 가 보고하는 가장 긴 구간이
      # 영원히 "Run quality checks" 한 덩어리라, 어느 명령이 병목인지
      # 타임스탬프로 지목할 수 없다.
      #
      # 주의: 이 파일이 곧 SHA_BEFORE 다. 과거 실행들이 잰 워크플로가 아니라,
      # 분리된 이 상태를 Before 로 고정해 측정한다.
      - name: Unit tests
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: E2E tests
        run: pnpm test:e2e
